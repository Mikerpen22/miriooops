<!DOCTYPE html>
<html lang="{{ .Site.Language }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site">
    {{ partial "header.html" . }}
    <main class="site-content" id="main-content" tabindex="-1">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
  <script>
  (function(){
    var motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    // Theme toggle
    var btn = document.querySelector('.theme-toggle');
    if (btn) {
      function updateThemeLabel() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
        btn.setAttribute('aria-pressed', String(dark));
      }
      updateThemeLabel();
      btn.addEventListener('click', function(){
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        updateThemeLabel();
      });
    }

    var backToTop = document.querySelector('.back-to-top');
    if (backToTop) backToTop.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: motion.matches ? 'auto' : 'smooth' });
    });

    document.querySelectorAll('.post-content table').forEach(function(table, index) {
      var wrap = document.createElement('div');
      wrap.className = 'table-scroll';
      wrap.setAttribute('role', 'region');
      wrap.setAttribute('aria-label', 'Table ' + (index + 1) + ', scroll horizontally if needed');
      wrap.setAttribute('tabindex', '0');
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });

    // Sticky header scroll detection
    var header = document.getElementById('site-header');
    if (header) {
      var SHOW_AT = 24, HIDE_AT = 12;
      var onScroll = function() {
        var y = window.scrollY;
        if (y > SHOW_AT) header.classList.add('scrolled');
        else if (y < HIDE_AT) header.classList.remove('scrolled');
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    }

    // Code block enhancements (copy button + language label)
    document.querySelectorAll('.highlight').forEach(function(block) {
      var pre = block.querySelector('pre');
      if (!pre) return;
      var code = pre.querySelector('code');
      var lang = '';
      if (code) {
        var cls = code.className || pre.className || '';
        var m = cls.match(/language-(\w+)/);
        if (m) lang = m[1];
      }

      var hdr = document.createElement('div');
      hdr.className = 'code-header';

      var langLabel = document.createElement('span');
      langLabel.className = 'code-lang';
      langLabel.textContent = lang || 'code';
      hdr.appendChild(langLabel);

      var copyBtn = document.createElement('button');
      copyBtn.className = 'code-copy';
      copyBtn.textContent = 'copy';
      copyBtn.setAttribute('aria-label', 'Copy code');
      copyBtn.setAttribute('aria-live', 'polite');
      copyBtn.addEventListener('click', function() {
        var text = code ? code.textContent : pre.textContent;
        function selectCode() {
          var range = document.createRange();
          range.selectNodeContents(code || pre);
          var selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          copyBtn.textContent = 'selected';
        }
        if (!navigator.clipboard) { selectCode(); return; }
        navigator.clipboard.writeText(text).then(function() {
          copyBtn.textContent = 'copied!';
          copyBtn.classList.add('copied');
          setTimeout(function() {
            copyBtn.textContent = 'copy';
            copyBtn.classList.remove('copied');
          }, 2000);
        }).catch(selectCode);
      });
      hdr.appendChild(copyBtn);
      block.insertBefore(hdr, pre);
    });

    // Scroll-triggered fade-in for cards
    var fadeEls = document.querySelectorAll('.post-card, .tag-card');
    if (fadeEls.length && 'IntersectionObserver' in window && !motion.matches) {
      fadeEls.forEach(function(el) { el.classList.add('reveal-pending'); });
      var fadeObserver = new IntersectionObserver(function(entries) {
        var visibleIndex = 0;
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            var el = entry.target;
            el.style.setProperty('--reveal-delay', Math.min(visibleIndex++ * 40, 120) + 'ms');
            el.classList.remove('reveal-pending');
            fadeObserver.unobserve(el);
          }
        });
      }, { threshold: 0.05 });
      fadeEls.forEach(function(el) { fadeObserver.observe(el); });
      function revealForReducedMotion() {
        if (!motion.matches) return;
        fadeObserver.disconnect();
        fadeEls.forEach(function(el) { el.classList.remove('reveal-pending'); });
      }
      if (motion.addEventListener) motion.addEventListener('change', revealForReducedMotion);
      else if (motion.addListener) motion.addListener(revealForReducedMotion);
    }
  })();
  </script>
</body>
</html>
